[package]
name = "reader"
version = "1.0.0"
description = "Lightweight Markdown and LaTeX reader"
authors = ["Shaoyilei"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "reader_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
notify = "6"
walkdir = "2"
regex = "1"
window-vibrancy = "0.7.1"
base64 = "0.22.1"
urlencoding = "2.1.3"
trash = "5.2.9"
tokio = { version = "1", features = ["sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61.2"
